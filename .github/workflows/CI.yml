name: Run pofff

on:
 pull_request:
   
jobs:
  run-pofff-local:
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 60
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v2
      with:
        fetch-depth: 0

    - name: Set up Python 3.14
      uses: actions/setup-python@v2
      with:
        python-version: 3.14
    
    - name: Install Flow Simulator
      run: |
        sudo apt-get update
        sudo apt-get install software-properties-common
        sudo apt-add-repository ppa:opm/ppa
        sudo apt-get update
        sudo apt-get install mpi-default-bin
        sudo apt-get install libopm-simulators-bin

    - name: Install plotting (LaTeX) and ert dependencies
      run: |
        sudo apt-get install texlive-fonts-recommended texlive-fonts-extra dvipng cm-super
        sudo apt-get install freeglut3-dev
        
    - name: Install Python dependecies
      run: |
        pip install --upgrade pip setuptools wheel
        pip install -r dev-requirements.txt
        
    - name: Install pofff
      run: |
        pip install .
        
    - name: Check code style and linting
      run: |
        black --target-version py312 src/ tests/ publication/ --check
        pylint src/ tests/ publication/
        ruff check src/ tests/ publication/
        mypy --ignore-missing-imports src/ tests/ publication/
      
    - name: Run the tests
      run: |
        pytest --cov=pofff --cov-report term-missing --basetemp=test_outputs tests/ --exitfirst
        
    - name: Build documentation
      run: |
        pushd docs
        make html
