[build-system]
requires = ["setuptools", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "pofff"
description = "An open-source image-based history-matching framework for the FluidFlower Benchmark study using OPM Flow"
authors = [{ name = "David Landa-Marbán", email = "dmar@norceresearch.no" }]
maintainers = [{ name = "David Landa-Marbán", email = "dmar@norceresearch.no" }]
dynamic = ["version"]
readme = {file = "README.md", content-type = "text/markdown"}
license = {text = "GPL-3.0"}
keywords = ["co2", "data assimilation", "emd", "ert", "everest", "flow", "fluidflower", "history matching", "opm", "wasserstein distance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent"
]
dependencies = [
    "alive-progress<=3.3.0",
    "ert<=17.0.0",
    "iterative_ensemble_smoother<=0.6.0",
    "mako<=1.3.10",
    "matplotlib<=3.10.7",
    "opencv-python<=4.12.0.88",
    "opm<=2025.10",
    "pandas<=2.3.3",
    "pyarrow<=22.0.0",
    "pot<=0.9.6.post1",
    "rtree<=1.4.1",
    "scipy<=1.16.3",
    "shapely<=2.1.2"
]
requires-python = ">=3.11"

[project.scripts]
pofff = "pofff.core.pofff:main"

[project.urls]
Homepage = "https://cssr-tools.github.io/pofff"
Repository = "https://github.com/cssr-tools/pofff"

[tool.setuptools]
packages.find.where = ["src"]
platforms = ["all"]
